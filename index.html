<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELVIS | AIMATEL PROJECTS - FIELD OS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--navy:#0b1e33;--blue:#0f4c75;--cyan:#00d4ff;--green:#00e676;--bg:#eef4fb;--line:#d6e2f0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Roboto;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#102a43}.top{background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.wrap{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 60px)}.side{background:#f7faff;border-right:1px solid var(--line);padding:10px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.nav{width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid #e2eaf5;background:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:8px;font-weight:700;font-size:13px;touch-action:manipulation}
.nav.active{background:linear-gradient(90deg,var(--blue),#163a5c);color:#fff}.nav b{background:#e2eaf5;padding:3px 8px;border-radius:20px;font-size:11px;color:var(--blue)}.nav.active b{background:rgba(255,255,255,.25);color:#fff}
.main{padding:14px}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(15,76,117,.07)}
.kpi b{font-size:26px;display:block}.kpi label{font-size:10px;color:#6b7d95;text-transform:uppercase;font-weight:800}
.kpi.green{border-left:4px solid var(--green)}.kpi.red{border-left:4px solid #ef4444}.kpi.blue{border-left:4px solid var(--blue)}.kpi.orange{border-left:4px solid #ff8f00}.kpi.cyan{border-left:4px solid var(--cyan)}.kpi.purple{border-left:4px solid #7c3aed}
.grid{display:grid;gap:10px}.grid2{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}
.inp{width:100%;padding:12px;border-radius:11px;border:1px solid #cbd5e1;background:#fff;font-size:14px}.btn{padding:12px 16px;border-radius:11px;border:none;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;width:100%;font-size:14px}.btn.r{background:#dc2626}.btn.g{background:#059669}
.badge{padding:4px 9px;border-radius:20px;font-size:10px;font-weight:800}.badge.los{background:#fee2e2;color:#b91c1c}.badge.ok{background:#dcfce7;color:#166534}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:10px;text-align:left;color:#6b7d95;padding:6px}.tbl td{padding:8px 6px;border-top:1px solid #eef2f7;font-size:13px}
.hidden{display:none!important}.mono{font-family:monospace}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;border-right:none;border-bottom:1px solid var(--line)}.side .nav{width:auto;flex:0 0 auto}.grid2,.grid4,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div><h1>ELVIS | AIMATEL PROJECTS</h1><small style="opacity:.8;font-size:10px">ISP FIELD OPERATIONS • FIBER • NETWORKING</small></div><div class="mono" style="text-align:right;font-size:10px"><div id="clock">Loading...</div><div style="color:#00e676">● ONLINE</div></div></div>
<div class="wrap"><div class="side" id="sidebar">
<button class="nav active" data-page="dash"><span><i class="fa-solid fa-gauge-high"></i> Dashboard</span><b id="c-all">0</b></button>
<button class="nav" data-page="tickets"><span><i class="fa-solid fa-ticket"></i> ISP Tickets</span><b id="c-tick">0</b></button>
<button class="nav" data-page="install"><span><i class="fa-solid fa-house-signal"></i> Installations</span><b id="c-inst">0</b></button>
<button class="nav" data-page="los"><span><i class="fa-solid fa-triangle-exclamation"></i> LOS / Faults</span><b id="c-los" style="background:#ef4444;color:white">0</b></button>
<button class="nav" data-page="maint"><span><i class="fa-solid fa-wrench"></i> Maintenance</span><b id="c-maint">0</b></button>
<button class="nav" data-page="inv"><span><i class="fa-solid fa-boxes-stacked"></i> Inventory</span></button>
<button class="nav" data-page="photos"><span><i class="fa-solid fa-camera"></i> Site Photos</span><b id="c-photo">0</b></button>
</div><div class="main">
<div id="p-dash"><div class="grid grid4"><div class="card kpi blue"><label>Today's Jobs</label><b id="k-today">0</b><small class="mono" id="k-date"></small></div><div class="card kpi green"><label>Completed</label><b id="k-done">0</b></div><div class="card kpi red"><label>Pending / LOS</label><b id="k-pend">0</b></div><div class="card kpi orange"><label>Installations</label><b id="k-inst">0</b></div></div><div class="grid grid3"><div class="card kpi cyan"><label>LOS / Faults</label><b id="k-los">0</b></div><div class="card kpi purple"><label>Maintenance</label><b id="k-maint">0</b></div><div class="card kpi red"><label>Fiber Cuts</label><b id="k-cuts">0</b></div></div><div class="grid grid2"><div class="card"><h3>Revolving: <span id="revolveTitle" style="color:#0f4c75">Tickets</span></h3><div id="revolveBox" class="mono" style="font-size:12px;background:#f8fafc;border-radius:10px;padding:10px;min-height:100px;margin-top:8px">No activity yet</div></div><div class="card"><h3>Daily Summary</h3><div id="summary" class="mono" style="font-size:12px;line-height:2;margin-top:8px"></div><table class="tbl" style="margin-top:8px"><thead><tr><th>Item</th><th>Used</th><th>Remain</th></tr></thead><tbody id="invDash"></tbody></table></div></div><div class="card"><h3>Recent Activity</h3><div id="recentList" class="mono" style="font-size:12px;margin-top:8px"></div></div></div>
<div id="p-tickets" class="hidden"><div class="card"><h3>New Ticket</h3><div class="grid grid2" style="margin-top:10px"><input id="tCust" class="inp" placeholder="Customer"><select id="tJob" class="inp"><option>LOS</option><option>No Internet</option><option>Slow</option><option>Installation</option><option>Maintenance</option></select><input id="tLoc" class="inp" placeholder="Location AP 03"><input id="tCause" class="inp" placeholder="Cause"><input id="tAction" class="inp" placeholder="Action"><input id="tPower" class="inp" placeholder="Power -21 dBm"><select id="tStatus" class="inp"><option>Completed</option><option>Pending</option></select></div><button id="btnTicket" class="btn" style="margin-top:12px">Save Ticket</button></div><div class="card"><div id="ticketList"></div></div></div>
<div id="p-install" class="hidden"><div class="card"><h3>New Installation</h3><div class="grid grid2" style="margin-top:10px"><input id="iCust" class="inp" placeholder="Customer"><input id="iLoc" class="inp" placeholder="Location"><input id="iONU" class="inp" placeholder="ONU"><input id="iRouter" class="inp" placeholder="Router"><input id="iCable" class="inp" placeholder="Cable length"><input id="iSplit" class="inp" placeholder="Splitter"><input id="iPow" class="inp" placeholder="Optical power"><input id="iPPPoE" class="inp" placeholder="PPPoE"><input id="iDate" class="inp" type="date"></div><button id="btnInstall" class="btn g" style="margin-top:12px">Save Installation</button></div><div class="card"><div id="installList"></div></div></div>
<div id="p-los" class="hidden"><div class="card" style="border:2px solid #fecaca"><h3 style="color:#b91c1c">LOS TICKET #<span id="losNo">024</span> - <span id="losTime" class="mono"></span></h3><div class="grid grid2" style="margin-top:12px"><input id="lCust" class="inp" placeholder="Customer"><input id="lLoc" class="inp" placeholder="Location"><input id="lTime" class="inp" type="time" value="14:20"><select id="lIssue" class="inp"><option>🔴 LOS</option><option>🟡 PON Blinking</option></select><input id="lOLT" class="inp" placeholder="OLT vSOL"><input id="lPON" class="inp" placeholder="PON 1/4/12"><select id="lONU" class="inp"><option>Online</option><option>Offline</option></select><input id="lPower" class="inp" placeholder="Power -23.4 dBm"><input id="lCause" class="inp" placeholder="Cause Fiber cut"><input id="lAction" class="inp" placeholder="Action Spliced"><select id="lRes" class="inp"><option>🟢 Restored</option><option>🟡 Pending</option><option>🔴 Not Restored</option></select></div><button id="btnLOS" class="btn r" style="margin-top:14px">COMPLETE TICKET</button></div><div class="card"><div id="losList"></div></div></div>
<div id="p-maint" class="hidden"><div class="card"><h3>Maintenance</h3><div class="grid grid2" style="margin-top:10px"><input id="mTask" class="inp" placeholder="Task"><input id="mLoc" class="inp" placeholder="Location"><input id="mDate" class="inp" type="date"><input id="mBy" class="inp" placeholder="Tech: Elvis"><textarea id="mNotes" class="inp" style="grid-column:1/-1" placeholder="Notes"></textarea></div><button id="btnMaint" class="btn" style="margin-top:10px">Add</button></div><div class="card"><div id="maintList"></div></div></div>
<div id="p-inv" class="hidden"><div class="card"><h3>Inventory</h3><table class="tbl" style="margin-top:10px"><thead><tr><th>Item</th><th>Used</th><th>Remain</th><th>+1</th></tr></thead><tbody id="invTable"></tbody></table></div></div>
<div id="p-photos" class="hidden"><div class="card"><h3>📸 Site Photos</h3><div class="grid grid2" style="margin-top:10px"><input type="file" id="sPhoto" accept="image/*" class="inp"><input id="sCap" class="inp" placeholder="Caption"></div><button id="btnPhoto" class="btn" style="margin-top:10px">Upload</button><div id="photoGrid" class="photos" style="margin-top:14px"></div></div></div>
</div></div>
<script>
(function(){
let tickets=JSON.parse(localStorage.getItem('tickets')||'[]'),installs=JSON.parse(localStorage.getItem('installs')||'[]'),los=JSON.parse(localStorage.getItem('los')||'[]'),maint=JSON.parse(localStorage.getItem('maint')||'[]'),photos=JSON.parse(localStorage.getItem('photos')||'[]');
let inv=JSON.parse(localStorage.getItem('inv')||'[{"name":"SC/APC connectors","used":8,"rem":142},{"name":"ONU","used":2,"rem":17},{"name":"1×8 splitter","used":1,"rem":6},{"name":"Drop cable","used":180,"rem":1420,"unit":"m"},{"name":"RJ45","used":6,"rem":94},{"name":"Fiber sleeves","used":5,"rem":80}]');
function updateClock(){try{let el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleString('en-KE',{hour12:false});let el2=document.getElementById('k-date');if(el2)el2.textContent=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){}}updateClock();setInterval(updateClock,1000);
window.go=function(id){document.querySelectorAll('[id^="p-"]').forEach(a=>a.classList.add('hidden'));let t=document.getElementById('p-'+id);if(t)t.classList.remove('hidden');document.querySelectorAll('.nav').forEach(a=>a.classList.remove('active'));let nav=document.querySelector('[data-page="'+id+'"]');if(nav)nav.classList.add('active');render();};
function saveAll(){localStorage.setItem('tickets',JSON.stringify(tickets));localStorage.setItem('installs',JSON.stringify(installs));localStorage.setItem('los',JSON.stringify(los));localStorage.setItem('maint',JSON.stringify(maint));localStorage.setItem('photos',JSON.stringify(photos));localStorage.setItem('inv',JSON.stringify(inv));}
window.addTicket=function(){let cust=document.getElementById('tCust').value.trim();if(!cust){alert('Enter customer');return;}let o={id:Date.now(),customer:cust,job:document.getElementById('tJob').value,loc:document.getElementById('tLoc').value,cause:document.getElementById('tCause').value,action:document.getElementById('tAction').value,power:document.getElementById('tPower').value,status:document.getElementById('tStatus').value,date:new Date().toLocaleString()};tickets.unshift(o);saveAll();document.getElementById('tCust').value='';render();go('dash');};
window.addInstall=function(){let cust=document.getElementById('iCust').value.trim();if(!cust){alert('Customer');return;}let o={id:Date.now(),customer:cust,location:document.getElementById('iLoc').value,onu:document.getElementById('iONU').value,router:document.getElementById('iRouter').value,cable:document.getElementById('iCable').value,splitter:document.getElementById('iSplit').value,power:document.getElementById('iPow').value,pppoe:document.getElementById('iPPPoE').value,date:document.getElement
